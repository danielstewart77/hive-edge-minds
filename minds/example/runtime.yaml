# Example mind — the edge mind's one contract file.
#
# `setup.sh` copies minds/example/ to minds/<your-mind>/ and fills this in;
# you can also copy and edit it by hand. Identity and soul prose live in the
# hive's knowledge graph, not here. Secrets (tokens, chat ids) live in .env.

name: example
# Stamped by setup.sh (uuidgen). Every write to the hive's memory carries
# this id; the display name above is never written there.
mind_id: <generated-uuid>
description: "Example — starter edge mind."

# Deployment profile. Sentinel adds a companion security-monitoring bundle
# managed separately from this generic mind runtime.
#   standard — one connected mind runtime
#   sentinel — mind runtime plus hive-sentinel, telemetry, and observability
profile: standard

# What this mind is allowed to be on this machine.
#   operator  — full host access by design: the mind operates the machine.
#   sandboxed — a connected mind on this machine without the operator posture.
role: sandboxed

# How the mind runs on this machine. setup.sh emits the matching installer.
#   systemd      — bare-metal Linux service (deploy/<name>.service)
#   container    — Docker container (docker-compose.yml)
#   windows-task — logon-triggered Windows scheduled task (deploy/<name>-task.xml)
deployment: systemd

# Harness adapter, by mind_templates/ basename. setup.sh instantiates it at
# minds/<name>/implementation.py.
#   claude_cli — Claude Code CLI (stream-json turns + tmux browser terminal)
#   codex_cli  — Codex CLI (one `codex exec --json` subprocess per turn)
harness: claude_cli

# Where this mind's inference goes. Orthogonal to the harness: either CLI runs
# against ollama, and both keep the browser terminal either way. The provider's
# env block lives in config.yaml; this names which one to apply.
#   anthropic — claude_cli only
#   openai    — codex_cli only
#   ollama    — either harness
provider: anthropic
default_model: sonnet
mind_server_port: 8421

# Surface bots run in-process by launch_mind_server_and_bots.py. An empty
# list means the mind is reachable only through hive-comms (e.g. its bot
# runs in the hive's own stack instead).
surfaces:
  - telegram

soul_file: souls/example.md
